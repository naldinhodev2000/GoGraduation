<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Sala</title>

    <link rel="stylesheet" href="../css/sala.css">

</head>

<body>

    <!-- MENU LATERAL -->

    <nav id="side-menu">

        <div class="menu-header">

            <div class="avatar">
                🎓
            </div>

            <h2>Bora Formar</h2>

            <span>Gestão da Comissão</span>

        </div>

        <div class="menu-items">

            <a href="salas.html">
                🏠
                <span>Minhas Salas</span>
            </a>

            <button id="logout-button">
                🚪
                <span>Sair</span>
            </button>

        </div>

    </nav>

    <div id="menu-overlay"></div>

    <!-- HEADER -->

    <header id="header-content">

        <button id="menu-toggle">
            ☰
        </button>

        <div class="header-title">

            <h1 id="group-name">
                Carregando...
            </h1>

            <span>
                Comissão de Formatura
            </span>

        </div>

        <a id="back-link" href="salas.html">

            ← Salas

        </a>

    </header>

    <!-- CONTEÚDO -->

    <main id="main-content">

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="info-card">

                <span class="card-icon">
                    🎯
                </span>

                <span class="card-title">
                    Meta
                </span>

                <strong id="goal-value">

                    R$ 0,00

                </strong>

            </div>

            <div class="info-card">

                <span class="card-icon">
                    💰
                </span>

                <span class="card-title">
                    Saldo Atual
                </span>

                <strong id="balance-value">

                    R$ 0,00

                </strong>

            </div>

        </section>

        <!-- TOKEN -->

        <section class="token-card">

            <div>

                <h3>

                    Código da Sala

                </h3>

                <strong id="group-token">

                    --------

                </strong>

            </div>

            <button id="copy-token-button">

                📋 Copiar

            </button>

        </section>

        <!-- AÇÕES -->

        <section class="actions">

            <button id="link-membros" class="action-button">

                <span class="action-icon">
                    👥
                </span>

                <span>
                    Membros
                </span>

            </button>

            <button id="link-lancar" class="action-button">

                <span class="action-icon">
                    💸
                </span>

                <span>
                    Lançar
                </span>

            </button>

            <button id="link-mensalidade" class="action-button">

                <span class="action-icon">
                    📅
                </span>

                <span>
                    Mensalidade
                </span>

            </button>

            <button id="link-rifa" class="action-button">

                <span class="action-icon">
                    🎟️
                </span>

                <span>
                    Rifas
                </span>

            </button>

        </section>

        <!-- RIFAS -->

        <section id="raffle-section">

            <div class="section-header">

                <h2>

                    Rifas

                </h2>

                <span>

                    Ativas

                </span>

            </div>

            <ul id="raffle-list">

            </ul>

            <div id="raffle-empty" class="hidden">

                <div class="empty-icon">

                    🎟️

                </div>

                <h3>

                    Nenhuma rifa cadastrada

                </h3>

                <p>

                    Crie sua primeira rifa para arrecadar fundos para a turma.

                </p>

            </div>

        </section>

        <p id="error-message" class="hidden"></p>

    </main>

    <!-- TEMPLATE DE CARD DE RIFA -->

    <template id="raffle-template">

        <li class="raffle-card">

            <div class="raffle-info">

                <h3 class="raffle-name">

                </h3>

                <p class="raffle-price">

                </p>

            </div>

            <span class="raffle-arrow">

                →

            </span>

        </li>

    </template>

    <script type="module" src="../js/sala.js"></script>

</body>

</html>
