<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Membros</title>

    <link rel="stylesheet" href="../css/membros.css">
</head>

<body>

    <header id="header-content">

        <a id="back-link" href="#">
            ← Voltar
        </a>

        <h1>Membros da Sala</h1>

    </header>

    <main id="main-content">

        <section id="members-section">

            <ul id="member-list"></ul>

            <p id="empty-state" class="hidden">
                Nenhum membro encontrado.
            </p>

            <p id="error-message" class="hidden"></p>

        </section>

    </main>

    <template id="member-template">

        <li class="member-card">

            <div class="member-header">

                <div>

                    <h3 class="member-name"></h3>

                    <span class="member-role"></span>

                </div>

            </div>

            <div class="member-summary">

                <div class="member-row">

                    <span>Status</span>

                    <span class="member-status"></span>

                </div>

                <div class="member-row">

                    <span>Rifas vendidas</span>

                    <span class="member-raffles"></span>

                </div>

                <div class="member-row">

                    <span>Valor devido</span>

                    <span class="member-debt"></span>

                </div>

            </div>

            <div class="payment-container"></div>

            <div class="admin-actions"></div>

        </li>

    </template>

    <script type="module" src="../js/membros.js"></script>

</body>

</html>
