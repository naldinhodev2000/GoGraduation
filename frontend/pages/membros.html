<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bora Formar - Membros</title>
        <link rel="stylesheet" href="../css/membros.css">
    </head>
    <body>
        <header id="header-content">
            <a id="back-link" href="#">‹ Voltar</a>
            <h1>Membros</h1>
        </header>
        <main id="main-content">
            <ul id="member-list"></ul>
            <p id="empty-state" class="hidden">Nenhum membro encontrado.</p>
            <p id="error-message" class="hidden"></p>
        </main>

        <script type="module">
            import groupService from "../js/services/groupService.js";
            import groupMemberService from "../js/services/groupMemberService.js";
            import memberSummaryService from "../js/services/memberSummaryService.js";
            import subscriptionPaymentService from "../js/services/subscriptionPaymentService.js";

            const params = new URLSearchParams(window.location.search);
            const groupId = params.get("id");

            const memberList = document.getElementById("member-list");
            const emptyState = document.getElementById("empty-state");
            const errorMessage = document.getElementById("error-message");
            const backLink = document.getElementById("back-link");

            let isAdmin = false;

            if (!groupId) {
                window.location.href = "salas.html";
            }
            backLink.href = `sala.html?id=${groupId}`;

            function statusLabel(summary) {
                if (summary.overdue) {
                    return "Atrasado";
                }
                if (summary.subscriptionStatus === "ACTIVE") {
                    return "Em dia";
                }
                if (!summary.subscriptionStatus) {
                    return "Sem mensalidade";
                }
                return summary.subscriptionStatus;
            }

            function buildPaymentForm(summary) {
                if (!summary.subscriptionId || !summary.overdue) {
                    return "";
                }

                return `
                    <details class="payment-form">
                        <summary>Registrar pagamento</summary>
                        <label>Valor pago</label>
                        <input type="number" step="0.01" class="pay-value" />
                        <label>Mês de referência</label>
                        <input type="month" class="pay-reference" />
                        <label>Comprovante (print)</label>
                        <input type="file" accept="image/*" class="pay-proof" />
                        <label>Observação</label>
                        <textarea class="pay-note" rows="2" placeholder="Ex: pago via Pix dia 05"></textarea>
                        <button class="pay-button" type="button">Confirmar pagamento</button>
                        <p class="pay-error hidden"></p>
                    </details>
                `;
            }

            function buildAdminControls(summary) {
                if (!isAdmin) {
                    return "";
                }

                if (summary.role === "ADMIN") {
                    return `<button class="role-button" data-action="demote">Remover admin</button>`;
                }

                return `<button class="role-button" data-action="promote">Tornar admin</button>`;
            }

            function attachPaymentHandler(item, summary) {
                const button = item.querySelector(".pay-button");
                if (!button) {
                    return;
                }

                button.addEventListener("click", async () => {
                    const valueInput = item.querySelector(".pay-value");
                    const referenceInput = item.querySelector(".pay-reference");
                    const proofInput = item.querySelector(".pay-proof");
                    const noteInput = item.querySelector(".pay-note");
                    const payError = item.querySelector(".pay-error");

                    payError.classList.add("hidden");

                    const value = valueInput.value;
                    const reference = referenceInput.value;

                    if (!value || !reference) {
                        payError.textContent = "Preencha o valor e o mês de referência.";
                        payError.classList.remove("hidden");
                        return;
                    }

                    button.disabled = true;
                    button.textContent = "Enviando...";

                    try {
                        let proofImage = null;
                        if (proofInput.files && proofInput.files[0]) {
                            proofImage = await subscriptionPaymentService.fileToBase64(proofInput.files[0]);
                        }

                        await subscriptionPaymentService.create(summary.subscriptionId, {
                            value,
                            date: new Date().toISOString(),
                            reference: `${reference}-01`,
                            proofImage,
                            note: noteInput.value || null
                        });

                        window.location.reload();
                    } catch (error) {
                        payError.textContent = error.message;
                        payError.classList.remove("hidden");
                        button.disabled = false;
                        button.textContent = "Confirmar pagamento";
                    }
                });
            }

            function attachRoleHandler(item, member) {
                const button = item.querySelector(".role-button");
                if (!button) {
                    return;
                }

                button.addEventListener("click", async () => {
                    const action = button.dataset.action;
                    const newRole = action === "promote" ? "ADMIN" : "MEMBER";

                    button.disabled = true;

                    try {
                        await groupMemberService.changeRole(groupId, member.userId, newRole);
                        window.location.reload();
                    } catch (error) {
                        alert(error.message);
                        button.disabled = false;
                    }
                });
            }

            async function loadMembers() {
                try {
                    const members = await groupMemberService.getDetailed(groupId);

                    try {
                        const myRole = await groupService.getMyRole(groupId);
                        isAdmin = myRole === "ADMIN";
                    } catch (error) {
                        isAdmin = false;
                    }

                    if (!members || members.length === 0) {
                        emptyState.classList.remove("hidden");
                        return;
                    }

                    for (const member of members) {
                        const item = document.createElement("li");
                        item.className = "member-card";

                        let summaryHtml = "";
                        let summary = null;

                        try {
                            summary = await memberSummaryService.getSummary(groupId, member.userId);
                            summary.role = member.role;

                            summaryHtml = `
                                <div class="member-row">
                                    <span>Status:</span>
                                    <span class="${summary.overdue ? 'status-late' : 'status-ok'}">${statusLabel(summary)}</span>
                                </div>
                                <div class="member-row">
                                    <span>Rifas vendidas:</span>
                                    <span>${summary.rafflesSold}</span>
                                </div>
                                <div class="member-row">
                                    <span>Valor devido (rifa):</span>
                                    <span>R$ ${Number(summary.raffleAmountDue).toFixed(2)}</span>
                                </div>
                                ${buildPaymentForm(summary)}
                            `;
                        } catch (error) {
                            summaryHtml = `<div class="member-row">Não foi possível carregar o resumo financeiro.</div>`;
                        }

                        item.innerHTML = `
                            <div class="member-name-row">
                                <span class="member-name">${member.name}</span>
                                <span class="member-role">${member.role === "ADMIN" ? "Admin" : "Membro"}</span>
                            </div>
                            ${summaryHtml}
                            ${buildAdminControls(member)}
                        `;

                        if (summary) {
                            attachPaymentHandler(item, summary);
                        }
                        attachRoleHandler(item, member);

                        memberList.appendChild(item);
                    }
                } catch (error) {
                    errorMessage.textContent = error.message || "Não foi possível carregar os membros.";
                    errorMessage.classList.remove("hidden");
                }
            }

            loadMembers();
        </script>
    </body>
</html>
