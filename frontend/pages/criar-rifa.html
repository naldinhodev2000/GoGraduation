<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Criar Rifa</title>

    <link rel="stylesheet" href="../css/criar-rifa.css">
</head>

<body>

    <header id="header-content">

        <a id="back-link" href="#">
            ‹ Voltar
        </a>

        <h1>
            Criar Rifa
        </h1>

    </header>


    <main id="main-content">


        <section class="card">

            <h2>
                Nova Rifa
            </h2>


            <form id="form-rifa">


                <label for="name">
                    Nome da rifa
                </label>

                <input 
                    id="name"
                    class="form-item"
                    type="text"
                    placeholder="Ex: Rifa de uma cesta"
                    required
                >



                <label for="value">
                    Valor do número
                </label>

                <input
                    id="value"
                    class="form-item"
                    type="number"
                    step="0.01"
                    placeholder="Ex: 10.00"
                    required
                >



                <label for="total">
                    Quantidade de números
                </label>

                <input
                    id="total"
                    class="form-item"
                    type="number"
                    placeholder="Ex: 200"
                >



                <p id="form-error" class="hidden"></p>



                <button 
                    id="button-criar"
                    type="submit">

                    Criar Rifa

                </button>


            </form>


        </section>


    </main>



    <script type="module" src="../js/criar-rifa.js"></script>

</body>

</html>
