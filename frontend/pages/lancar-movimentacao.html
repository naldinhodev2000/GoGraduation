<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Bora Formar - Lançar Movimentação</title>
        <link rel="stylesheet" href="../css/lancar-movimentacao.css">
    </head>
    <body>
        <header id="header-content">
            <button id="menu-toggle" aria-label="Menu">☰</button>
            <h1>Lançar Movimentação</h1>
        </header>
        <main id="main-content">
            <form id="form-movimentacao">
                <label>Tipo:</label>
                <select id="type" class="form-item" required>
                    <option value="ENTRADA">Entrada</option>
                    <option value="SAIDA">Saída</option>
                </select>
                <label>Valor:</label>
                <input id="value" class="form-item" type="number" step="0.01" required>
                <label>Descrição:</label>
                <input id="description" class="form-item" type="text" required>

                <p id="form-error" class="hidden"></p>

                <input id="button-lancar" type="submit" value="Lançar">
            </form>
        </main>

        <script type="module">
            import cashService from "../js/services/cashService.js";
            import { getCurrentUserId } from "../js/jwtUtils.js";

            const params = new URLSearchParams(window.location.search);
            const groupId = params.get("id");

            const form = document.getElementById("form-movimentacao");
            const errorMessage = document.getElementById("form-error");

            if (!groupId) {
                document.getElementById("back-link").href = `sala.html?id=${groupId}`;
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                errorMessage.classList.add("hidden");

                const type = document.getElementById("type").value;
                const value = document.getElementById("value").value;
                const description = document.getElementById("description").value;
                const userId = getCurrentUserId();

                try {
                    await cashService.addTransaction({ value, description, type, groupId, userId });
                    window.location.href = `sala.html?id=${groupId}`;
                } catch (error) {
                    errorMessage.textContent = error.message || "Não foi possível lançar a movimentação.";
                    errorMessage.classList.remove("hidden");
                }
            });
        </script>
    </body>
</html>
