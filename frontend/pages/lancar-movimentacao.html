<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Lançar Movimentação</title>

    <link rel="stylesheet" href="../css/lancar-movimentacao.css">
</head>

<body>

    <header id="header-content">

        <a id="back-link" href="#">
            ‹ Voltar
        </a>

        <h1>
            Lançar Movimentação
        </h1>

    </header>

    <main id="main-content">

        <section class="form-card">

            <h2>
                Nova movimentação
            </h2>

            <form id="form-movimentacao">

                <label>
                    Tipo
                </label>

                <div class="type-toggle">

                    <button
                        type="button"
                        class="type-option selected"
                        data-type="ENTRADA">

                        Entrada

                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="SAIDA">

                        Saída

                    </button>

                </div>

                <input
                    type="hidden"
                    id="type"
                    value="ENTRADA">

                <label for="value">
                    Valor
                </label>

                <input
                    id="value"
                    class="form-item"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="0,00"
                    required>

                <label for="description">
                    Descrição
                </label>

                <input
                    id="description"
                    class="form-item"
                    type="text"
                    placeholder="Ex: venda de rifa, compra de material..."
                    required>

                <label for="origin">
                    Origem da movimentação
                </label>

                <select
                    id="origin"
                    class="form-item">

                    <option value="NONE">
                        Nenhuma
                    </option>

                    <option value="RAFFLE">
                        Rifa
                    </option>

                    <option value="SUBSCRIPTION">
                        Mensalidade
                    </option>

                </select>

                <div id="raffle-container" class="hidden">

                    <label for="raffle">
                        Selecione a rifa
                    </label>

                    <select
                        id="raffle"
                        class="form-item">

                        <option value="">
                            Selecione...
                        </option>

                    </select>

                </div>

                <div id="subscription-container" class="hidden">

                    <label for="subscription-payment">
                        Selecione o pagamento da mensalidade
                    </label>

                    <select
                        id="subscription-payment"
                        class="form-item">

                        <option value="">
                            Selecione...
                        </option>

                    </select>

                </div>

                <p id="form-error" class="hidden"></p>

                <button
                    id="button-lancar"
                    type="submit">

                    Lançar movimentação

                </button>

            </form>

        </section>

    </main>

    <script
        type="module"
        src="../js/lancar-movimentacao.js">
    </script>

</body>

</html>
