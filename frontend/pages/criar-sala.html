<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Criar Sala</title>

    <link rel="stylesheet" href="../css/criar-sala.css">
</head>

<body>

    <header id="header-content">

        <a id="back-link" href="salas.html" aria-label="Voltar">
            ←
        </a>

        <div class="header-text">
            <h1>Criar Sala</h1>
            <p>Organize sua comissão de formatura</p>
        </div>

    </header>

    <main id="main-content">

        <section class="form-card">

            <div class="form-header">

                <div class="form-icon">
                    🎓
                </div>

                <h2>Nova Sala</h2>

                <p>
                    Preencha as informações abaixo para criar uma nova sala de formatura.
                </p>

            </div>

            <form id="form-criar-sala">

                <div class="input-group">

                    <label for="name">
                        Nome da Sala
                    </label>

                    <input
                        id="name"
                        class="form-item"
                        type="text"
                        placeholder="Ex.: ADS 2026"
                        required>

                </div>

                <div class="input-group">

                    <label for="goal">
                        Meta Financeira
                    </label>

                    <input
                        id="goal"
                        class="form-item"
                        type="number"
                        step="0.01"
                        placeholder="50000"
                        required>

                </div>

                <div class="input-group">

                    <label for="team">
                        Turma
                    </label>

                    <input
                        id="team"
                        class="form-item"
                        type="text"
                        placeholder="5º Período"
                        required>

                </div>

                <div class="input-group">

                    <label for="course">
                        Curso
                    </label>

                    <input
                        id="course"
                        class="form-item"
                        type="text"
                        placeholder="Sistemas para Internet"
                        required>

                </div>

                <p id="form-error" class="hidden"></p>

                <button id="button-criar" type="submit">
                    Criar Sala
                </button>

            </form>

        </section>

    </main>

    <script type="module">

        import groupService from "../js/services/groupService.js";
        import { getCurrentUserId } from "../js/jwtUtils.js";

        const form = document.getElementById("form-criar-sala");
        const errorMessage = document.getElementById("form-error");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            errorMessage.classList.add("hidden");

            const name = document.getElementById("name").value;
            const goal = document.getElementById("goal").value;
            const team = document.getElementById("team").value;
            const course = document.getElementById("course").value;
            const createdBy = getCurrentUserId();

            try {

                await groupService.create({
                    name,
                    goal,
                    team,
                    course,
                    createdBy
                });

                window.location.href = "salas.html";

            } catch (error) {

                errorMessage.textContent =
                    error.message || "Não foi possível criar a sala.";

                errorMessage.classList.remove("hidden");

            }

        });

    </script>

</body>

</html>
