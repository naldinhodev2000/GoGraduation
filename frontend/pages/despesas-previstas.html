<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Despesas Previstas</title>

    <link
        rel="stylesheet"
        href="../css/despesas-previstas.css">

</head>

<body>


    <header id="header-content">


        <a
            id="back-link"
            href="#">

            ← Voltar

        </a>



        <h1>

            Despesas Previstas

        </h1>


    </header>




    <main id="main-content">


        <section class="form-card">


            <h2>

                Nova despesa prevista

            </h2>




            <form id="form-despesa">



                <label for="description">

                    Descrição

                </label>



                <input

                    id="description"

                    class="form-item"

                    type="text"

                    placeholder="Ex: Buffet"

                    required>





                <label for="value">

                    Valor previsto

                </label>




                <input

                    id="value"

                    class="form-item"

                    type="number"

                    step="0.01"

                    min="0"

                    placeholder="0,00"

                    required>






                <p

                    id="form-error"

                    class="hidden">

                </p>






                <button

                    id="button-salvar"

                    type="submit">


                    Salvar previsão


                </button>



            </form>



        </section>



    </main>




    <script

        type="module"

        src="../js/despesas-previstas.js">

    </script>



</body>

</html>
