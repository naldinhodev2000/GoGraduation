<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bora Formar - Mensalidade</title>

    <link rel="stylesheet" href="../css/mensalidade.css">

</head>


<body>


<header id="header-content">

    <a id="back-link" href="#">
        ‹ Voltar
    </a>


    <h1>
        Mensalidade
    </h1>


</header>




<main id="main-content">


    <section class="content-card">


        <h2>
            Mensalidades cadastradas
        </h2>


        <ul id="fee-list"></ul>


        <p id="fee-empty" class="hidden">
            Nenhuma mensalidade cadastrada ainda.
        </p>


    </section>





    <section class="content-card">


        <h2>
            Nova mensalidade
        </h2>



        <form id="form-mensalidade">


            <label for="value">
                Valor
            </label>


            <input
                id="value"
                class="form-item"
                type="number"
                step="0.01"
                min="0"
                placeholder="0,00"
                required>




            <label for="start-date">
                Início
            </label>


            <input
                id="start-date"
                class="form-item"
                type="date"
                required>




            <label for="end-date">
                Fim (opcional)
            </label>


            <input
                id="end-date"
                class="form-item"
                type="date">





            <p
                id="form-error"
                class="hidden">
            </p>




            <button
                id="button-criar"
                type="submit">

                Criar mensalidade

            </button>



        </form>


    </section>



</main>





<script
    type="module"
    src="../js/mensalidade.js">
</script>


</body>

</html>
